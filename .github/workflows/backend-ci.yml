name: Back-end CI (.NET)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar Dependências
        run: dotnet restore src/back
        continue-on-error: true # Permite passar enquanto a solução .NET completa é estruturada nas próximas tarefas

      - name: Compilar API
        run: dotnet build src/back --no-restore
        continue-on-error: true