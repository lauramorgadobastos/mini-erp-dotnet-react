services:
  mysqldb:
    image: mysql:8.0
    container_name: stockflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-stockflow_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/CREATE_SCHEMA.sql:/docker-entrypoint-initdb.d/01_CREATE_SCHEMA.sql

volumes:
  mysql_data: